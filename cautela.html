<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Materiais - Controle de Estoque</title>
    <link rel="stylesheet" href="css/estilo.css">

</head>
<body>
    <div id="mySidebar" class="sidebar">
        <span class="close-btn" onclick="toggleMenu()">×</span>
        <a href="home.html">Início</a>
        <a href="#">Perfil</a>
        <a href="#">Configurações</a>
        <a href="#">Sair</a>
    </div>

    <div class="header">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="welcome-text">Bem-Vindo, Sgt Hudson!</div>
        <div class="user-avatar"></div>
    </div>

    <div class="main-content">
        
        <button class="btn-cadastro">Cadastrar Material</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 5%;">Nº</th>
                        <th style="width: 15%;">Material</th>
                        <th style="width: 10%;">Quantidade</th>
                        <th style="width: 10%;">Seção/OM</th>
                        <th style="width: 15%;">Nome</th>
                        <th style="width: 15%;">Posto/Graduação</th>
                        <th style="width: 30%;">Telefone</th>
                        <th style="width: 30%;">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <tr>
                        <td>1</td>
                        <td>Monitor 24"</td>
                        <td>01</td>
                        <td>TI/B ADM AP CMO</td>
                        <td>FULANO</td>
                        <td>SGT</td>
                        <td>(67)9 9999-9999</td>
                        <td>?????????</td>
                    </tr>
                    
                </tbody>
            </table>
        </div>
        <a href="home.html">
            <button class="btn-inicio">Inicio</button>   
        </a>
    </div>
   <script>
        let menuAberto = false;
        function toggleMenu() {
            const sidebar = document.getElementById("mySidebar");
            if (!menuAberto) {
                sidebar.style.width = "250px";
            } else {
                sidebar.style.width = "0";
            }
            menuAberto = !menuAberto;
        }
    </script>



</body>
</html>
