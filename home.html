<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Controle de Estoque</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <div id="mySidebar" class="sidebar">
        <span class="close-btn" onclick="toggleMenu()">×</span>
        <a href="#">Perfil</a>
        <a href="#">Configurações</a>
        <a href="#">Sair</a>
    </div>

    <div class="header">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="welcome-text">Bem-Vindo, Sgt Hudson!</div>
        <div class="user-avatar"></div>
    </div>

    <div class="container">
        <a href="materiais.html" class="btn-card btn-light-blue">
            <span style="font-size: 80px; margin-right: 10px;">📦</span>
            Meus Materiais
        </a>

        <a href="cautela.html" class="btn-card btn-dark-blue">
            <span style="font-size: 80px; margin-right: 10px;">📋</span>
            Cautela de Material
        </a>
    </div>

    <script>
        let menuAberto = false;
        function toggleMenu() {
            const sidebar = document.getElementById("mySidebar");
            if (!menuAberto) {
                sidebar.style.width = "250px";
            } else {
                sidebar.style.width = "0";
            }
            menuAberto = !menuAberto;
        }
    </script>

</body>
</html>
