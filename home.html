<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Controle de Estoque</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }

        body { background-color: #ffffff; display: flex; flex-direction: column; height: 100vh; }

        /* Barra Superior (Header) */
        .header {
            background-color: #4a83a8;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .menu-icon {
            font-size: 30px;
            cursor: pointer;
            color: #1a1a1a;
        }

        .welcome-text {
            font-weight: bold;
            font-size: 18px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background-color: #000;
            border-radius: 50%;
        }

        /* Menu Lateral (Sidebar) */
        .sidebar {
            height: 100%;
            width: 0; /* Começa fechado */
            position: fixed;
            z-index: 20;
            top: 0;
            left: 0;
            background-color: #021d38;
            overflow-x: hidden;
            transition: 0.3s; /* Velocidade da animação */
            padding-top: 60px;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 20px;
            color: white;
            display: block;
            transition: 0.2s;
        }

        .sidebar a:hover { background-color: #34495e; }

        .sidebar .close-btn {
            position: absolute;
            top: 10px;
            right: 25px;
            font-size: 36px;
            cursor: pointer;
        }

        /* Área dos Botões */
        .container {
            padding: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-card {
            width: 250px;
            height: 140px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-card:hover { transform: scale(1.05); }

        /* Cores específicas dos botões da sua foto */
        .btn-light-blue { background-color: #bdc3d7; color: #1a1a1a; }
        .btn-dark-blue { background-color: #2e3b64; }

        .btn-card img {
            width: 50px;
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <div id="mySidebar" class="sidebar">
        <span class="close-btn" onclick="toggleMenu()">×</span>
        <a href="#">Início</a>
        <a href="#">Perfil</a>
        <a href="#">Configurações</a>
        <a href="#">Sair</a>
    </div>

    <div class="header">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="welcome-text">Bem-Vindo, Sgt Hudson!</div>
        <div class="user-avatar"></div>
    </div>

    <div class="container">
        <a href="materiais.html" class="btn-card btn-light-blue">
            <span style="font-size: 80px; margin-right: 10px;">📦</span>
            Meus Materiais
        </a>

        <a href="estoque.html" class="btn-card btn-dark-blue">
            <span style="font-size: 80px; margin-right: 10px;">📋</span>
            Cautela de Material
        </a>
    </div>

    <script>
        let menuAberto = false;
        function toggleMenu() {
            const sidebar = document.getElementById("mySidebar");
            if (!menuAberto) {
                sidebar.style.width = "250px";
            } else {
                sidebar.style.width = "0";
            }
            menuAberto = !menuAberto;
        }
    </script>

</body>
</html>
